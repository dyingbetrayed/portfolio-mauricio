backend:
  name: github
  repo: dyingbetrayed/portfolio-mauricio
  branch: main
  base_url: https://portfolio-mauricio-beta.vercel.app
  auth_endpoint: api/auth

local_backend: true

media_folder: "public/work"
public_folder: "/work"

collections:
  - name: "settings"
    label: "Configuración"
    files:
      - label: "Categorías"
        name: "categories"
        file: "src/content/categories.json"
        fields:
          - { label: "Título Branding", name: "branding_title", widget: "string", default: "BRANDING" }
          - { label: "Título Social Media", name: "social_media_title", widget: "string", default: "SOCIAL MEDIA" }
          - { label: "Título Flyers", name: "flyers_title", widget: "string", default: "FLYERS" }
          - { label: "Título Merch", name: "merch_title", widget: "string", default: "MERCH" }

  - name: "home"
    label: "Inicio (Hero)"
    files:
      - label: "Contenido Home"
        name: "home"
        file: "src/content/home.json"
        fields:
          - { label: "Imagen de fondo", name: "hero_image", widget: "image" }
          - { label: "Color de fondo", name: "background_color", widget: "color" }
          - { label: "Opacidad capa base", name: "overlay_opacity", widget: "number", value_type: "float" }
          - { label: "Opacidad capa activa", name: "overlay_opacity_active", widget: "number", value_type: "float" }

  - name: "about"
    label: "Sobre mí"
    files:
      - label: "Contenido About"
        name: "about"
        file: "src/content/about.json"
        fields:
          - { label: "Imagen", name: "image", widget: "image" }
          - { label: "Color de fondo", name: "background_color", widget: "color" }
          - { label: "Color de texto", name: "text_color", widget: "color" }
          - { label: "Ubicación", name: "location", widget: "string" }
          - label: "Párrafos"
            name: "paragraphs"
            widget: "list"
            field: { label: "Párrafo", name: "paragraph", widget: "text" }

  - name: "contact"
    label: "Contacto"
    files:
      - label: "Información de contacto"
        name: "contact"
        file: "src/content/contact.json"
        fields:
          - { label: "Color de fondo", name: "background_color", widget: "color" }
          - { label: "Color de texto", name: "text_color", widget: "color" }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Instagram URL", name: "instagram_url", widget: "string" }
          - { label: "WhatsApp URL", name: "whatsapp_url", widget: "string" }

  - name: "projects_branding"
    label: "Proyectos Branding"
    folder: "src/content/projects/branding"
    create: true
    extension: "json"
    format: "json"
    identifier_field: "name"
    slug: "{{slug}}"
    fields:
      - { label: "ID", name: "id", widget: "string" }
      - { label: "Nombre", name: "name", widget: "string" }
      - { label: "Año", name: "year", widget: "string" }
      - { label: "Ubicación", name: "location", widget: "string" }
      - { label: "Color", name: "color", widget: "color" }
      - { label: "Tagline", name: "tagline", widget: "text", required: false }
      - { label: "Servicios", name: "services", widget: "list", required: false }
      - label: "Secciones"
        name: "sections"
        widget: "list"
        required: false
        fields:
          - { label: "Título", name: "label", widget: "string" }
          - label: "Párrafos"
            name: "paragraphs"
            widget: "list"
            field: { label: "Párrafo", name: "paragraph", widget: "text" }
      - { label: "Nota legal", name: "note", widget: "string", required: false }
      - label: "Imágenes"
        name: "images"
        widget: "list"
        required: false
        field: { label: "Imagen", name: "image", widget: "image" }

  - name: "projects_social_media"
    label: "Proyectos Social Media"
    folder: "src/content/projects/social-media"
    create: true
    extension: "json"
    format: "json"
    identifier_field: "name"
    slug: "{{slug}}"
    fields:
      - { label: "ID", name: "id", widget: "string" }
      - { label: "Nombre", name: "name", widget: "string" }
      - { label: "Año", name: "year", widget: "string" }
      - { label: "Ubicación", name: "location", widget: "string" }
      - { label: "Color", name: "color", widget: "color" }
      - { label: "Tagline", name: "tagline", widget: "text", required: false }
      - { label: "Servicios", name: "services", widget: "list", required: false }
      - label: "Secciones"
        name: "sections"
        widget: "list"
        required: false
        fields:
          - { label: "Título", name: "label", widget: "string" }
          - label: "Párrafos"
            name: "paragraphs"
            widget: "list"
            field: { label: "Párrafo", name: "paragraph", widget: "text" }
      - { label: "Nota legal", name: "note", widget: "string", required: false }
      - label: "Imágenes"
        name: "images"
        widget: "list"
        required: false
        field: { label: "Imagen", name: "image", widget: "image" }

  - name: "projects_flyers"
    label: "Proyectos Flyers"
    folder: "src/content/projects/flyers"
    create: true
    extension: "json"
    format: "json"
    identifier_field: "name"
    slug: "{{slug}}"
    fields:
      - { label: "ID", name: "id", widget: "string" }
      - { label: "Nombre", name: "name", widget: "string" }
      - { label: "Año", name: "year", widget: "string" }
      - { label: "Ubicación", name: "location", widget: "string" }
      - { label: "Color", name: "color", widget: "color" }
      - { label: "Tagline", name: "tagline", widget: "text", required: false }
      - { label: "Servicios", name: "services", widget: "list", required: false }
      - label: "Secciones"
        name: "sections"
        widget: "list"
        required: false
        fields:
          - { label: "Título", name: "label", widget: "string" }
          - label: "Párrafos"
            name: "paragraphs"
            widget: "list"
            field: { label: "Párrafo", name: "paragraph", widget: "text" }
      - { label: "Nota legal", name: "note", widget: "string", required: false }
      - label: "Imágenes"
        name: "images"
        widget: "list"
        required: false
        field: { label: "Imagen", name: "image", widget: "image" }

  - name: "projects_merch"
    label: "Proyectos Merch"
    folder: "src/content/projects/merch"
    create: true
    extension: "json"
    format: "json"
    identifier_field: "name"
    slug: "{{slug}}"
    fields:
      - { label: "ID", name: "id", widget: "string" }
      - { label: "Nombre", name: "name", widget: "string" }
      - { label: "Año", name: "year", widget: "string" }
      - { label: "Ubicación", name: "location", widget: "string" }
      - { label: "Color", name: "color", widget: "color" }
      - { label: "Tagline", name: "tagline", widget: "text", required: false }
      - { label: "Servicios", name: "services", widget: "list", required: false }
      - label: "Secciones"
