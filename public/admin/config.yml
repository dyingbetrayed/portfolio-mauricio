backend:
  name: github
  repo: dyingbetrayed/portfolio-mauricio
  branch: main
  base_url: https://portfolio-mauricio-beta.vercel.app
  auth_endpoint: api/auth

local_backend: true

media_folder: "public/work"
public_folder: "/work"

collections:
  - name: "settings"
    label: "Configuración"
    files:
      - label: "Categorías"
        name: "categories"
        file: "src/content/categories.json"
        fields:
          - { label: "Título Categoría 1", name: "category_1_title", widget: "string", default: "BRANDING" }
          - { label: "Título Categoría 2", name: "category_2_title", widget: "string", default: "SOCIAL MEDIA" }
          - { label: "Título Categoría 3", name: "category_3_title", widget: "string", default: "FLYERS" }
          - { label: "Título Categoría 4", name: "category_4_title", widget: "string", default: "MERCH" }
          - { label: "Color hover Categoría 1 (Work)", name: "category_1_hover_color", widget: "color", default: "#e26000" }
          - { label: "Color hover Categoría 2 (Work)", name: "category_2_hover_color", widget: "color", default: "#d70016" }
          - { label: "Color hover Categoría 3 (Work)", name: "category_3_hover_color", widget: "color", default: "#b2cdb6" }
          - { label: "Color hover Categoría 4 (Work)", name: "category_4_hover_color", widget: "color", default: "#ab9900" }

      - label: "Ajustes del Sitio (Logo)"
        name: "site_settings"
        file: "src/content/site_settings.json"
        fields:
          - { label: "Texto del Logo", name: "logo_text", widget: "string", default: "Mauricio Atencia" }
          - { label: "Imagen del Logo (Opcional — dejar vacío para usar texto)", name: "logo_image", widget: "file", required: false, allow_multiple: false, media_library: {config: {multiple: false}} }

  - name: "home_collection"
    label: "Inicio (Hero)"
    files:
      - label: "Contenido Home"
        name: "home"
        file: "src/content/home.json"
        fields:
          - { label: "Fondo (Imagen o Video)", name: "hero_media", widget: "file" }
          - { label: "Color de fondo", name: "background_color", widget: "color" }
          - { label: "Opacidad capa base", name: "overlay_opacity", widget: "number", value_type: "float" }
          - { label: "Opacidad capa activa", name: "overlay_opacity_active", widget: "number", value_type: "float" }

  - name: "about_collection"
    label: "Sobre mí"
    files:
      - label: "Contenido About"
        name: "about"
        file: "src/content/about.json"
        fields:
          - { label: "Imagen", name: "image", widget: "image" }
          - { label: "Color de fondo", name: "background_color", widget: "color" }
          - { label: "Color de texto", name: "text_color", widget: "color" }
          - { label: "Ubicación", name: "location", widget: "string" }
          - label: "Párrafos"
            name: "paragraphs"
            widget: "list"
            field: { label: "Párrafo", name: "paragraph", widget: "text" }

  - name: "contact_collection"
    label: "Contacto"
    files:
      - label: "Información de contacto"
        name: "contact"
        file: "src/content/contact.json"
        fields:
          - { label: "Color de fondo", name: "background_color", widget: "color" }
          - { label: "Color de texto", name: "text_color", widget: "color" }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Instagram URL", name: "instagram_url", widget: "string" }
          - { label: "WhatsApp URL", name: "whatsapp_url", widget: "string" }

  - name: "projects_category_1"
    label: "Proyectos Categoría 1"
    folder: "src/content/projects"
    create: true
    filter:
      field: category
      value: "category_1"
    extension: "json"
    format: "json"
    identifier_field: "name"
    slug: "{{slug}}"
    fields:
      - { label: "Categoría", name: "category", widget: "select", options: ["category_1", "category_2", "category_3", "category_4"], default: "category_1" }
      - { label: "ID (automático)", name: "id", widget: "hidden", default: "" }
      - { label: "Nombre", name: "name", widget: "string" }
      - { label: "Año", name: "year", widget: "string" }
      - { label: "Ubicación", name: "location", widget: "string" }
      - { label: "Color", name: "color", widget: "color" }
      - { label: "Tagline", name: "tagline", widget: "text", required: false }
      - { label: "Servicios", name: "services", widget: "list", required: false }
      - label: "Secciones"
        name: "sections"
        widget: "list"
        required: false
        fields:
          - { label: "Título", name: "label", widget: "string" }
          - label: "Párrafos"
            name: "paragraphs"
            widget: "list"
            field: { label: "Párrafo", name: "paragraph", widget: "text" }
      - { label: "Nota legal", name: "note", widget: "string", required: false }
      - label: "Imágenes"
        name: "images"
        widget: "list"
        required: false
        field: { label: "Archivo (Imagen o Video)", name: "image", widget: "file" }

  - name: "projects_category_2"
    label: "Proyectos Categoría 2"
    folder: "src/content/projects/"
    create: true
    filter:
      field: category
      value: "category_2"
    extension: "json"
    format: "json"
    identifier_field: "name"
    slug: "{{slug}}"
    fields:
      - { label: "Categoría", name: "category", widget: "select", options: ["category_1", "category_2", "category_3", "category_4"], default: "category_2" }
      - { label: "ID (automático)", name: "id", widget: "hidden", default: "" }
      - { label: "Nombre", name: "name", widget: "string" }
      - { label: "Año", name: "year", widget: "string" }
      - { label: "Ubicación", name: "location", widget: "string" }
      - { label: "Color", name: "color", widget: "color" }
      - { label: "Tagline", name: "tagline", widget: "text", required: false }
      - { label: "Servicios", name: "services", widget: "list", required: false }
      - label: "Secciones"
        name: "sections"
        widget: "list"
        required: false
        fields:
          - { label: "Título", name: "label", widget: "string" }
          - label: "Párrafos"
            name: "paragraphs"
            widget: "list"
            field: { label: "Párrafo", name: "paragraph", widget: "text" }
      - { label: "Nota legal", name: "note", widget: "string", required: false }
      - label: "Imágenes"
        name: "images"
        widget: "list"
        required: false
        field: { label: "Archivo (Imagen o Video)", name: "image", widget: "file" }

  - name: "projects_category_3"
    label: "Proyectos Categoría 3"
    folder: "./src/content/projects"
    create: true
    filter:
      field: category
      value: "category_3"
    extension: "json"
    format: "json"
    identifier_field: "name"
    slug: "{{slug}}"
    fields:
      - { label: "Categoría", name: "category", widget: "select", options: ["category_1", "category_2", "category_3", "category_4"], default: "category_3" }
      - { label: "ID (automático)", name: "id", widget: "hidden", default: "" }
      - { label: "Nombre", name: "name", widget: "string" }
      - { label: "Año", name: "year", widget: "string" }
      - { label: "Ubicación", name: "location", widget: "string" }
      - { label: "Color", name: "color", widget: "color" }
      - { label: "Tagline", name: "tagline", widget: "text", required: false }
      - { label: "Servicios", name: "services", widget: "list", required: false }
      - label: "Secciones"
        name: "sections"
        widget: "list"
        required: false
        fields:
          - { label: "Título", name: "label", widget: "string" }
          - label: "Párrafos"
            name: "paragraphs"
            widget: "list"
            field: { label: "Párrafo", name: "paragraph", widget: "text" }
      - { label: "Nota legal", name: "note", widget: "string", required: false }
      - label: "Imágenes"
        name: "images"
        widget: "list"
        required: false
        field: { label: "Archivo (Imagen o Video)", name: "image", widget: "file" }

  - name: "projects_category_4"
    label: "Proyectos Categoría 4"
    folder: "./src/content/projects/"
    create: true
    filter:
      field: category
      value: "category_4"
    extension: "json"
    format: "json"
    identifier_field: "name"
    slug: "{{slug}}"
    fields:
      - { label: "Categoría", name: "category", widget: "select", options: ["category_1", "category_2", "category_3", "category_4"], default: "category_4" }
      - { label: "ID (automático)", name: "id", widget: "hidden", default: "" }
      - { label: "Nombre", name: "name", widget: "string" }
      - { label: "Año", name: "year", widget: "string" }
      - { label: "Ubicación", name: "location", widget: "string" }
      - { label: "Color", name: "color", widget: "color" }
      - { label: "Tagline", name: "tagline", widget: "text", required: false }
      - { label: "Servicios", name: "services", widget: "list", required: false }
      - label: "Secciones"
        name: "sections"
        widget: "list"
        required: false
        fields:
          - { label: "Título", name: "label", widget: "string" }
          - label: "Párrafos"
            name: "paragraphs"
            widget: "list"
            field: { label: "Párrafo", name: "paragraph", widget: "text" }
      - { label: "Nota legal", name: "note", widget: "string", required: false }
      - label: "Imágenes"
        name: "images"
        widget: "list"
        required: false
        field: { label: "Archivo (Imagen o Video)", name: "image", widget: "file" }
